spring.application.name=order-tracker
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:sqlite:./data/app.db

# SQLite starts a transaction deferred and only takes the write lock at the first write. Promoting
# a transaction that has already read is refused outright, without waiting out busy_timeout, so any
# read-then-write loses the race instead of queueing for it. Beginning every transaction IMMEDIATE
# takes the lock upfront, which is what turns contention into a wait. Carried as driver properties
# rather than query parameters on the URL, so the per-class URLs in the tests inherit them.
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.journal_mode=WAL

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Columns are declared in the order they are written. Hibernate otherwise reorders them when it
# creates a table, and along the way an identity column comes out with no type at all: `id` instead
# of `id integer`. SQLite only assigns a primary key by itself when the column is INTEGER, and it
# lets a NULL through a PRIMARY KEY that is not, so the row is written with no id. Hibernate then
# reads that row back over a join, sees a null identifier, and takes it for an absent one — an order
# comes back with an empty item list. The migration path ddl-auto=update takes never reordered, so
# only a schema created from scratch was affected: every test run, and any deployment starting from
# an empty file with create.
spring.jpa.properties.hibernate.column_ordering_strategy=legacy

spring.data.web.pageable.max-page-size=100

# The API answers in one language. Bean Validation's stock messages are the half of the payload we
# do not write, and Hibernate Validator ships a bundle per locale: resolved from Accept-Language, a
# blank name came back as "não deve estar em branco" beside a detail written in English, so which
# language a refusal spoke was decided by whoever was asking. Nothing else here is localised —
# timestamps travel as instants, the status values are literals — so pinning the locale costs
# nothing and is what keeps one answer from arriving in two languages.
spring.web.locale=en
spring.web.locale-resolver=fixed

app.cors.allowed-origins=http://localhost:5173

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=24h
